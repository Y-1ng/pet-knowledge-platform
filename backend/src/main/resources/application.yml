spring:
  main:
    web-application-type: servlet
  # 数据库密码、AI API Key、邮箱授权码等私密配置放在 application-local.yml。
  # 该文件已加入 .gitignore，不会提交到仓库；克隆后请自行创建一份。
  config:
    import: optional:classpath:application-local.yml
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:schema.sql, classpath:breed_data.sql
  application:
    name: pet-knowledge-platform
  datasource:
    url: jdbc:mysql://localhost:3306/pet_knowledge?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    openai:
      api-key: ${AI_API_KEY:}
      base-url: ${AI_BASE_URL:https://api.xiaomimimo.com}
      chat:
        options:
          model: ${AI_MODEL:mimo-v2.5-pro}
      embedding:
        enabled: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.trust: smtp.qq.com

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: net.zjitc.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    net.zjitc.mapper: debug
    org.springframework.ai: debug
    com.openai: debug

file:
  upload:
    path: "D:/pet-uploads/"

server:
  port: 8081
